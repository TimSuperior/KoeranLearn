services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: koreanlearn
      POSTGRES_USER: korean
      POSTGRES_PASSWORD: korean
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korean -d koreanlearn"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10

  reminder-worker:
    build:
      context: ./apps/api
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m app.reminder_worker

  bot:
    build:
      context: ./apps/bot
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    command: python -m bot.main

  web:
    build:
      context: ./apps/web
      target: dev
    env_file: .env
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      api:
        condition: service_healthy

  backup:
    image: postgres:16-alpine
    profiles: ["ops"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: koreanlearn
      POSTGRES_USER: korean
      PGPASSWORD: ${POSTGRES_PASSWORD:-korean}
      BACKUP_DIR: /backups
    volumes:
      - ./scripts:/scripts:ro
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    command: sh /scripts/backup_postgres.sh

volumes:
  postgres_data:
  backups:
